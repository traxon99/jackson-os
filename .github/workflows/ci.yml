name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No secret names in web bundle
        run: pnpm check-no-secrets-in-web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jos .

      - name: Assert image size under 250 MB
        run: |
          SIZE="$(docker image inspect -f '{{.Size}}' jos)"
          echo "Image size bytes: ${SIZE}"
          LIMIT=$((250 * 1024 * 1024))
          if [ "${SIZE}" -ge "${LIMIT}" ]; then
            echo "Image size ${SIZE} bytes is >= ${LIMIT} bytes (250 MiB)" >&2
            exit 1
          fi
