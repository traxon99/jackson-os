# Deploy to Fly.io after CI on main succeeds.
# Fly HTTP health checks (see deploy/fly.toml) keep serving the previous release
# if a new deploy fails its checks — the rolling strategy replaces machines
# only when the new version is healthy.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy -c deploy/fly.toml --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
