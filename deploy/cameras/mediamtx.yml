# MediaMTX relay for Jackson OS live cameras (see docs/CAMERAS.md).
#
# This container publishes NO host ports. Only the app container can reach
# it, over the private Compose network, and the app only serves the streams
# to signed-in sessions (/api/cameras/*). Do not add `ports:` for it.
#
# Pinned to the image tag in deploy/compose.cameras.yaml. Keys follow the
# sample config shipped with that release.

logLevel: info

# Who may do what. Nothing outside the Compose network can connect at all,
# so "any IP" below means "any container on this stack".
authMethod: internal
authInternalUsers:
  # The webcam ffmpeg process runs inside this container and publishes to
  # itself over localhost. Nobody else may publish.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
  # The app reads HLS and the control API (for live/offline status).
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: api

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false

# RTSP is only used inside the container (webcam ffmpeg -> relay) and as a
# client when pulling the Pi. Bind it to localhost.
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

rtmp: false
webrtc: false
srt: false

hls: true
hlsAddress: :8888
# Plain fMP4 HLS: about 1 playlist + 1 segment request per second per viewer,
# which keeps load on the session check low. Expect ~2-4 s latency.
hlsVariant: fmp4
hlsSegmentDuration: 1s
hlsSegmentCount: 7
# Keep muxing even with no viewers so a stream opens instantly.
hlsAlwaysRemux: true

pathDefaults:
  rtspTransport: tcp

paths:
  # Raspberry Pi + Arducam. The Pi runs its own MediaMTX (deploy/pi/) and
  # this relay pulls from it. The real source URL, including the Pi's read
  # password, comes from MTX_PATHS_PI_SOURCE in deploy/.env, e.g.
  #   rtsp://jos:<password>@jackson-pi.local:8554/cam
  # Until that is set the path just waits, and the UI shows it OFFLINE.
  pi:
    source: publisher

  # USB webcam on the server (Linux /dev/video0, mapped in by
  # compose.cameras.yaml). ffmpeg turns it into H.264 and publishes here.
  # Override the whole command with MTX_PATHS_WEBCAM_RUNONINIT if your camera
  # needs other flags (see docs/CAMERAS.md, "Webcam troubleshooting").
  webcam:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning
      -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30 -i /dev/video0
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -g 30 -b:v 2500k -maxrate 2500k -bufsize 5000k
      -an -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: true
